# Hermes API auth sidecar — key registry secret.
#
# This secret holds the client API keys that Traefik validates before
# forwarding requests to Hermes, plus the internal token Hermes itself
# accepts.  It is consumed by the auth-sidecar container in
# hermes-deployment.yaml.
#
# IMPORTANT: this is a TEMPLATE.  Do not apply it verbatim — the values below
# are placeholders.  In production, add these keys to the existing
# `hermes-env-vault` secret (Vault-synced) instead of creating a second
# secret, so rotation and access control stay in one place.
#
#   HERMES_API_KEYS_JSON  — JSON array of {id, secret} client keys.
#                           `id` is a human label used for audit logging;
#                           `secret` is the Bearer token clients send.
#   HERMES_INTERNAL_TOKEN — the single token Hermes accepts.  Traefik swaps
#                           the client key for this before forwarding.
#                           Generate with: openssl rand -hex 32
#
# Example:
#   HERMES_API_KEYS_JSON='{"keys":[{"id":"dave","secret":"sk-hermes-abc123"},{"id":"partner","secret":"sk-hermes-def456"}]}'
#   HERMES_INTERNAL_TOKEN='0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
#
apiVersion: v1
kind: Secret
metadata:
  name: hermes-api-auth
  namespace: hermes
type: Opaque
stringData:
  HERMES_API_KEYS_JSON: '{"keys":[{"id":"REPLACE_ME","secret":"REPLACE_ME"}]}'
  HERMES_INTERNAL_TOKEN: "REPLACE_WITH_64_HEX_CHARS"
