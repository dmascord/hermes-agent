services:
  hermes-swarm:
    image: hermes-agent:latest
    container_name: hermes-swarm
    command: ["gateway", "run"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8642:8642"
    networks:
      - traefik
    volumes:
      - /srv/opencode/hermes-swarm-home:/opt/data
    environment:
      HERMES_HOME: "/opt/data"

      # ── API Server ──────────────────────────────────────────────
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_CORS_ORIGINS: "*"
      API_SERVER_KEY: "${API_SERVER_KEY}"

      # ── Hermes-Swarm Model Pool ────────────────────────────────
      # Primary model — GitHub Copilot GPT-5 Mini (effectively unlimited)
      HERMES_SWARM_PRIMARY_MODEL: "github-copilot/gpt-5-mini"

      # Premium / stronger fallbacks for harder tasks
      # OpenAI/Codex-backed hermes-code requests are handled separately via
      # HERMES_CODE_MODEL below; the swarm pool stays cost/performance-oriented.
      HERMES_SWARM_FALLBACK_1: "github-copilot/gpt-5.4"
      HERMES_SWARM_FALLBACK_2: "zai/glm-4.7"
      HERMES_SWARM_FALLBACK_3: "minimax/MiniMax-M2.7"
      HERMES_SWARM_FALLBACK_4: "github-copilot/gpt-5-mini"
      HERMES_SWARM_FALLBACK_5: "google/gemini-2.5-flash"

      # Budget / resilient fallbacks
      HERMES_SWARM_FALLBACK_6: "opencode-zen/gpt-5-nano"
      HERMES_SWARM_FALLBACK_7: "opencode-zen/ling-2.6-flash-free"
      HERMES_SWARM_FALLBACK_8: "google/gemma-4-26b-a4b-it:free"
      HERMES_SWARM_FALLBACK_9: "nvidia/nemotron-nano-9b-v2:free"
      HERMES_SWARM_FALLBACK_10: "openrouter/google/gemma-3-5b-eu:free"
      HERMES_SWARM_FALLBACK_11: "openrouter/meta-llama/llama-3.1-8b-instruct:free"
      HERMES_SWARM_FALLBACK_12: "openrouter/mistralai/mistral-7b-instruct:free"

      # Explicit large-context fallbacks for overflow recovery
      # MiniMax-M2.7 has 204K context, GLM-4.7 has 128K
      HERMES_SWARM_LARGE_CONTEXT_FALLBACK_1: "minimax/MiniMax-M2.7"
      HERMES_SWARM_LARGE_CONTEXT_FALLBACK_2: "zai/glm-4.7"
      HERMES_SWARM_LARGE_CONTEXT_FALLBACK_3: "github-copilot/gpt-5.4"
      HERMES_SWARM_LARGE_CONTEXT_FALLBACK_4: "github-copilot/gpt-5-mini"
      HERMES_SWARM_LARGE_CONTEXT_FALLBACK_5: "google/gemini-2.5-flash"

      HERMES_SWARM_SELECTION_POLICY: "complexity-aware"
      HERMES_SWARM_ENABLE_SCOUT: "true"
      HERMES_SWARM_SCOUT_MODEL: "github-copilot/gpt-5-mini"
      HERMES_SWARM_ENABLE_VERIFIER: "true"
      HERMES_SWARM_VERIFY_MODEL: "github-copilot/gpt-5.4"
      HERMES_SWARM_MAX_TOKENS: "4000"
      HERMES_SWARM_DAILY_TOKEN_LIMIT: "50000"

      # ── Hermes-Code & Hermes-Agent ────────────────────────────
      HERMES_INFERENCE_PROVIDER: "zai"
      HERMES_CODE_MODEL: "openai/gpt-5.4"
      HERMES_AGENT_MODEL: "opencode-zen/big-pickle"
      HERMES_AGENTIC_FULL_MODEL: "opencode-zen/big-pickle"
      HERMES_AGENTIC_REMOTE_MODEL: "opencode-zen/big-pickle"

      # ── Provider API Keys ─────────────────────────────────────
      # OpenCode platforms
      OPENCODE_ZEN_API_KEY: "${OPENCODE_ZEN_API_KEY}"
      OPENCODE_GO_API_KEY: "${OPENCODE_GO_API_KEY}"
      COPILOT_GITHUB_TOKEN: "${COPILOT_GITHUB_TOKEN}"
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
      # Third-party providers
      ZAI_API_KEY: "${ZAI_API_KEY}"
      GLM_API_KEY: "${GLM_API_KEY}"
      MINIMAX_API_KEY: "${MINIMAX_API_KEY}"
      GROQ_API_KEY: "${GROQ_API_KEY}"
      COHERE_API_KEY: "${COHERE_API_KEY}"
      CEREBRAS_API_KEY: "${CEREBRAS_API_KEY}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OPENAI_CODEX_API_KEY: "${OPENAI_CODEX_API_KEY}"
      OPENAI_OAUTH_TOKEN: "${OPENAI_OAUTH_TOKEN}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      ARCEEAI_API_KEY: "${ARCEEAI_API_KEY}"

      # ── Gateway ───────────────────────────────────────────────
      GATEWAY_ALLOW_ALL_USERS: "true"

    # Traefik labels — routes https://hermes.tusker.net.au to this container
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hermes-swarm.rule=Host(`hermes.tusker.net.au`)"
      - "traefik.http.routers.hermes-swarm.entrypoints=websecure"
      - "traefik.http.routers.hermes-swarm.tls=true"
      - "traefik.http.services.hermes-swarm.loadbalancer.server.port=8642"
      - "traefik.docker.network=traefik"

networks:
  traefik:
    external: true
